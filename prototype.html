<style>
/* Layout: single mobile-app column (max 440px), centered on wide screens; sticky top bar, fixed bottom tab bar, scrolling content between them */
:root{
  --bg:#F6F1E6; --surface:#FFFFFF; --surface-2:#EFE6D3; --surface-3:#E7DCC2;
  --ink:#2B2420; --ink-muted:#766C5F; --line:#E2D6BC;
  --accent:#7C2630; --accent-ink:#FBEFEE; --accent-soft:#F3DEDC;
  --gold:#A3762E; --gold-soft:#EFE0C3;
  --pos:#1F7A4D; --pos-soft:#DCEEE2; --neg:#B5452F; --neg-soft:#F6E2DB;
  --focus:#7C2630;
  --font-display:'Fraunces',Georgia,serif;
  --font-body:'Manrope',-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1612; --surface:#241D18; --surface-2:#2C231C; --surface-3:#372B21;
    --ink:#F1E8DA; --ink-muted:#B3A795; --line:#3B3024;
    --accent:#E08A90; --accent-ink:#2A1416; --accent-soft:#3A201F;
    --gold:#D9AC5C; --gold-soft:#3B2E18;
    --pos:#5BC48C; --pos-soft:#1C3328; --neg:#E58868; --neg-soft:#3A241D;
    --focus:#E08A90; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1612; --surface:#241D18; --surface-2:#2C231C; --surface-3:#372B21;
  --ink:#F1E8DA; --ink-muted:#B3A795; --line:#3B3024;
  --accent:#E08A90; --accent-ink:#2A1416; --accent-soft:#3A201F;
  --gold:#D9AC5C; --gold-soft:#3B2E18;
  --pos:#5BC48C; --pos-soft:#1C3328; --neg:#E58868; --neg-soft:#3A241D;
  --focus:#E08A90; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  display:flex; justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
.frame{width:100%;max-width:440px;min-height:100%;display:flex;flex-direction:column;position:relative}
@media (min-width:620px){
  .frame{margin-block:28px;min-height:calc(100% - 56px);border:1px solid var(--line);border-radius:26px;box-shadow:0 20px 50px -24px rgba(30,20,10,.35);overflow:hidden;background:var(--surface)}
}
.ic{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit}
a{color:var(--accent)}
/* topbar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:.2px}
.biz-switch{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0;background:none;border:none;text-align:left;padding:0;cursor:pointer;color:inherit}
.biz-switch .label{font-size:.68rem;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em}
.biz-switch .name{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px}
.icon-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none}
.icon-btn .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--neg);border:2px solid var(--surface)}
/* content */
.content{flex:1;padding:16px 18px 100px;display:flex;flex-direction:column;gap:18px}
.content.narrow{gap:14px}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:-4px}
.back-btn{background:none;border:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:4px}
.page-title{font-size:1.22rem}
.sub{color:var(--ink-muted);font-size:.86rem}
/* bottom nav */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;display:flex;background:var(--surface);border-top:1px solid var(--line);z-index:50;
  padding-top:7px; padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));
  padding-left:max(10px,env(safe-area-inset-left,0px)); padding-right:max(10px,env(safe-area-inset-right,0px));}
.navbtn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-muted);cursor:pointer;padding:5px 2px;font-size:.66rem;font-weight:600;letter-spacing:.01em}
.navbtn.active{color:var(--accent)}
/* cards & rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-tile{border-radius:16px;padding:14px 14px 15px;display:flex;flex-direction:column;gap:6px}
.sum-tile.collect{background:var(--neg-soft)}
.sum-tile.advance{background:var(--pos-soft)}
.sum-tile .amt{font-family:var(--font-mono);font-size:1.32rem;font-weight:600;font-variant-numeric:tabular-nums}
.sum-tile.collect .amt{color:var(--neg)}
.sum-tile.advance .amt{color:var(--pos)}
.sum-tile .lbl{font-size:.74rem;color:var(--ink-muted);font-weight:600}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick-btn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink);text-align:center}
.quick-btn .ic{color:var(--accent)}
.quick-btn span{font-size:.68rem;font-weight:600;line-height:1.15}
.section-head{display:flex;align-items:baseline;justify-content:space-between}
.section-head h2{font-size:1rem}
.link-btn{background:none;border:none;color:var(--accent);font-weight:700;font-size:.78rem;cursor:pointer;padding:0}
.list{display:flex;flex-direction:column;gap:9px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;text-align:left}
.row .avatar{width:38px;height:38px;border-radius:50%;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--font-display);color:var(--accent);flex:none}
.row .main{flex:1;min-width:0}
.row .main .t{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main .s{font-size:.76rem;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{border-radius:999px;padding:5px 10px;font-size:.72rem;font-weight:700;font-family:var(--font-mono);white-space:nowrap}
.pill.due{background:var(--neg-soft);color:var(--neg)}
.pill.adv{background:var(--pos-soft);color:var(--pos)}
.pill.flat{background:var(--surface-3);color:var(--ink-muted)}
.entry{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:none}
.entry .marker{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none}
.entry.given .marker{background:var(--neg)}
.entry.received .marker{background:var(--pos)}
.entry .main{flex:1;min-width:0}
.entry .note{font-weight:600;font-size:.88rem}
.entry .date{font-size:.72rem;color:var(--ink-muted);margin-top:1px}
.entry .amt{font-family:var(--font-mono);font-weight:700;font-size:.92rem;white-space:nowrap}
.entry.given .amt{color:var(--neg)}
.entry.received .amt{color:var(--pos)}
.entry .bal{font-size:.68rem;color:var(--ink-muted);font-family:var(--font-mono);margin-top:2px}
/* buttons */
.btn{border-radius:12px;padding:11px 16px;font-weight:700;font-size:.86rem;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.secondary{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:.78rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.action-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.action-row .btn{flex-direction:column;padding:10px 4px;font-size:.66rem;gap:5px}
/* tiles grid (More) */
.tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;color:var(--ink)}
.tile .ic-wrap{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.tile .ic-wrap .ic{color:var(--accent)}
.tile span{font-size:.7rem;font-weight:700;line-height:1.2}
/* forms */
label{font-size:.76rem;font-weight:700;color:var(--ink-muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.field{margin-bottom:14px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:inherit;color:var(--ink);font-family:var(--font-body)
}
input:focus,select:focus,textarea:focus,button:focus-visible,.row:focus-visible,.tile:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.radio-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.radio-row:last-child{border-bottom:none}
.radio-row input{accent-color:var(--accent);width:18px;height:18px}
.radio-row .t{font-weight:700;font-size:.9rem;flex:1}
.toggle{position:relative;width:42px;height:24px;flex:none}
.toggle input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer}
.toggle .track{position:absolute;inset:0;background:var(--surface-3);border-radius:999px;transition:background .15s}
.toggle .thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.toggle input:checked + .track{background:var(--accent)}
.toggle input:checked ~ .thumb{transform:translateX(18px)}
/* sheet / modal */
.sheet-overlay{position:fixed;inset:0;background:rgba(20,14,10,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet-overlay.wide{align-items:center}
.sheet{background:var(--surface);width:100%;max-width:440px;max-height:85vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheet-overlay.wide .sheet{border-radius:20px;max-height:80vh}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions .btn{flex:1}
/* banner/toast */
.banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));max-width:400px;width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:.84rem;font-weight:600;z-index:200;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.banner .ic{color:var(--pos);flex:none}
/* misc */
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--gold-soft);color:var(--gold);font-size:.7rem;font-weight:700;border-radius:999px;padding:4px 9px}
.empty{text-align:center;padding:38px 10px;color:var(--ink-muted)}
.empty .ic{width:30px;height:30px;margin-bottom:8px;opacity:.6}
.table{width:100%;border-collapse:collapse;font-size:.84rem}
.table th{text-align:left;font-size:.68rem;text-transform:uppercase;color:var(--ink-muted);padding:0 6px 8px;border-bottom:1px solid var(--line)}
.table td{padding:9px 6px;border-bottom:1px solid var(--line)}
.table tr:last-child td{border-bottom:none}
.table td.num,.table th.num{text-align:right;font-family:var(--font-mono)}
.scrollx{overflow-x:auto}
.divider{height:1px;background:var(--line);border:none;margin:2px 0}
.checklist{display:flex;flex-direction:column;gap:9px;font-size:.84rem}
.checklist li{display:flex;gap:8px;align-items:flex-start;list-style:none}
.checklist .ic{color:var(--pos);margin-top:1px}
.accordion-item{border-bottom:1px solid var(--line)}
.accordion-head{width:100%;background:none;border:none;display:flex;justify-content:space-between;align-items:center;padding:13px 2px;cursor:pointer;color:inherit;text-align:left;font-weight:700;font-size:.88rem}
.accordion-body{padding:0 2px 14px;font-size:.84rem;color:var(--ink-muted)}
.copy-box{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.hint{font-size:.76rem;color:var(--ink-muted)}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.stat-row:last-child{border-bottom:none}
.stat-row .v{font-family:var(--font-mono);font-weight:700}
/* login */
.login-wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:40px 24px;gap:26px}
.login-logo{text-align:center;display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.login-logo .mark{width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-family:var(--font-display);font-size:1.5rem;font-weight:700}
.step-dots{display:flex;gap:6px;justify-content:center}
.step-dots span{width:6px;height:6px;border-radius:50%;background:var(--line)}
.step-dots span.on{background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.row,.tile,.quick-btn,.navbtn{transition:transform .1s}}

/* Payments & statement screen */
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stat-value{font-family:var(--font-mono);font-size:1.15rem;font-weight:700;margin-top:5px;overflow-wrap:anywhere}
</style>

/* ---------- API helpers ---------- */
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY); }catch(e){ return null; } }
function setTokens(a,r){ try{ localStorage.setItem(TOKEN_KEY,a); if(r) localStorage.setItem(REFRESH_KEY,r); }catch(e){} }
function clearTokens(){ try{ localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(REFRESH_KEY); }catch(e){} }

function firstErrorMessage(data){
  if(!data || typeof data!=="object") return null;
  for(var k in data){
    if(Array.isArray(data[k]) && data[k].length) return data[k][0];
    if(typeof data[k]==="string") return data[k];
  }
  return null;
}

async function api(path, opts){
  opts = opts || {};
  var headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  var token = getToken();
  if(token) headers["Authorization"] = "Bearer "+token;
  var fetchOpts = {method: opts.method||"GET", headers: headers};
  if(opts.body !== undefined) fetchOpts.body = JSON.stringify(opts.body);
  var res;
  try{
    res = await fetch(API_BASE+path, fetchOpts);
  }catch(e){
    throw {message:"Can't reach the server. Is the backend running?"};
  }
  if(res.status===401 && token){
    clearTokens();
    DATA=null; NAV.loggedIn=false; NAV.loginStep="mobile"; NAV.loginMobile="";
    renderLogin();
    throw {message:"Session expired. Please log in again."};
  }
  var data=null;
  if(res.status!==204){
    try{ data = await res.json(); }catch(e){ data=null; }
  }
  if(!res.ok){
    throw {status:res.status, message:(data&&(data.detail||firstErrorMessage(data)))||("Request failed ("+res.status+")"), data:data};
  }
  return data;
}
function apiGet(path){ return api(path, {method:"GET"}); }
function apiPost(path, body){ return api(path, {method:"POST", body: body||{}}); }
function apiPatch(path, body){ return api(path, {method:"PATCH", body: body||{}}); }
function apiDelete(path){ return api(path, {method:"DELETE"}); }
function unwrap(x){ return (x && x.results) ? x.results : (x||[]); }

function relativeTime(iso){
  if(!iso) return "";
  try{
    var d=new Date(iso);
    var diffMin=Math.floor((Date.now()-d.getTime())/60000);
    if(diffMin<1) return "Just now";
    if(diffMin<60) return diffMin+" min ago";
    var hrs=Math.floor(diffMin/60);
    if(hrs<24) return hrs+" hour"+(hrs>1?"s":"")+" ago";
    var days=Math.floor(hrs/24);
    if(days<2) return "Yesterday";
    return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
  }catch(e){ return ""; }
}

function mapCustomer(c){
  return {id:String(c.id), name:c.name, mobile:c.mobile||"—",
    given:Number(c.total_given||0), received:Number(c.total_received||0), balance:Number(c.balance||0)};
}
function mapEntry(e){ return {id:String(e.id), type:e.type, amount:Number(e.amount), note:e.note||"", date:e.date}; }
function mapInventory(i){ return {id:String(i.id), name:i.name, price:Number(i.price||0), qty:Number(i.qty||0), low:Number(i.low_stock_threshold||5)}; }
function mapStaff(s){
  return {id:String(s.id), name:s.name,
    role: s.role==="owner" ? "Owner – full access" : (s.can_add_entries ? "Staff – can add entries" : "Staff – view only"),
    mobile:s.mobile||"—"};

function mapDevice(d){ return {id:String(d.id), name:d.name, lastActive:relativeTime(d.last_active), current:!!d.is_current}; }
function mapNotification(n){ return {id:String(n.id), title:n.title, body:n.body||"", time:relativeTime(n.created_at), read:!!n.read}; }
function mapBill(b, custList){
  var cust = b.customer!=null ? custList.find(function(c){ return c.id===String(b.customer); }) : null;
  return {id:String(b.id), customerName: cust?cust.name:"Walk-in",
    items:(b.items||[]).map(function(it){ return {name:it.name, qty:it.qty, price:Number(it.price)}; }),
    subtotal:Number(b.subtotal), tax:Number(b.tax_amount), total:Number(b.total), date:(b.created_at||"").slice(0,10)};

function mapRecentEntries(list){
  return list.map(function(r){ return {c:{name:r.customer_name}, e:{type:r.type, note:r.note||"", date:r.date, amount:Number(r.amount)}}; });
}

/* ---------- storage backend selection ----------
   Native Android build (no PC/backend needed): everything is kept on the
   phone itself via localStorage, through LocalDB below.
   Browser dev preview: talks to the Django API on this machine, through ApiDB.
   Both expose the exact same async method set so the rest of the app
   (bootstrapData/refreshBusiness/App.*) never needs to know which one is active. */
function isNative(){
  try{ return new URLSearchParams(window.location.search).get("native")==="1"; }catch(e){ return false; }
}

var LOCAL_DB_KEY = "dk_local_db_v1";
var LOCAL_SESSION_KEY = "dk_local_session";

/* ---------- on-device DB migrations ----------
   The local store is one JSON blob in localStorage. Schema changes can't just
   rename the key (that would silently lose every existing user's data on their
   next app update) - so instead each stored blob carries a schemaVersion, and
   every version bump is a small function that mutates old data into the new
   shape in place. CURRENT_SCHEMA_VERSION is the shape the rest of the app code
   expects right now; MIGRATIONS[v] upgrades a store from version v to v+1.

   To change the schema later: bump CURRENT_SCHEMA_VERSION by 1, and add a new
   MIGRATIONS[<old version>] entry that transforms the data - never edit an
   already-shipped migration, since some installs may still need to run it. */
var CURRENT_SCHEMA_VERSION = 2;

var MIGRATIONS = {
  // v1 (first shipped shape, no schemaVersion field) -> v2: give every
  // business an explicit currency, so multi-currency support can be added
  // later without another migration for data created before this version.
  1: function(store){
    (store.businesses||[]).forEach(function(b){
      if(b.currency===undefined) b.currency="INR";
    });
  }
  // 2: function(store){ ... v2 -> v3 changes go here ... }
};

function runMigrations(store){
  var version = store.schemaVersion || 1;
  var changed = false;
  while(version < CURRENT_SCHEMA_VERSION){
    var migrate = MIGRATIONS[version];
    if(!migrate){
      console.warn("No migration found from schema version "+version+" - stopping early.");
      break;
    }
    migrate(store);
    version++;
    changed = true;
  }
  store.schemaVersion = version;
  if(changed) localSaveStore(store);
  return store;
}

function freshStore(){
  return {schemaVersion:CURRENT_SCHEMA_VERSION, seq:1, users:[], businesses:[], memberships:[], customers:[], entries:[], inventory:[], bills:[], devices:[], notifications:[]};
}

function localLoadStore(){
  var store=null;
  try{ var raw=localStorage.getItem(LOCAL_DB_KEY); if(raw) store=JSON.parse(raw); }catch(e){ store=null; }
  if(!store) return freshStore();
  return runMigrations(store);
}
function localSaveStore(s){ try{ localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(s)); }catch(e){} }
function localNextId(s){ var id=String(s.seq); s.seq++; return id; }
function localSession(){ try{ return localStorage.getItem(LOCAL_SESSION_KEY); }catch(e){ return null; } }
function localSetSession(uid){ try{ localStorage.setItem(LOCAL_SESSION_KEY, uid); }catch(e){} }
function localClearSession(){ try{ localStorage.removeItem(LOCAL_SESSION_KEY); }catch(e){} }
function localCustomerTotals(s, custId){
  var given=0, received=0;
  s.entries.forEach(function(e){ if(e.customerId===custId){ if(e.type==="given") given+=e.amount; else received+=e.amount; } });
  return {given:given, received:received, balance:given-received};
}
async function sha256Hex(text){
  try{
    var enc=new TextEncoder().encode(text);
    var buf=await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
  }catch(e){
    var h=0; for(var i=0;i<text.length;i++){ h=(h*31+text.charCodeAt(i))>>>0; }
    return "fb"+h.toString(16);
  }
}

var LocalDB = {
  isLoggedIn:function(){ return !!localSession(); },
  logout:function(){ localClearSession(); },

  register:async function(data){
    var s=localLoadStore();
    if(s.users.some(function(u){return u.mobile===data.mobile;})) throw {message:"An account with this mobile number already exists."};
    var hash=await sha256Hex(data.password);
    var uid=localNextId(s);
    var user={id:uid, mobile:data.mobile, passwordHash:hash, name:data.name, language:"en", appLock:"none", pinHash:null, autoBackup:true, lastBackupAt:null, currentBusinessId:null};
    s.users.push(user);
    var bizId=localNextId(s);
    s.businesses.push({id:bizId, ownerId:uid, name:data.businessName||"My Business", type:"", upiId:"", currency:"INR", createdAt:new Date().toISOString()});
    user.currentBusinessId=bizId;
    s.memberships.push({id:localNextId(s), businessId:bizId, userId:uid, name:user.name||user.mobile, mobile:user.mobile, role:"owner", canAddEntries:true, createdAt:new Date().toISOString()});
    localSaveStore(s);
    localSetSession(uid);
  },
  login:async function(data){
    var s=localLoadStore();
    var user=s.users.find(function(u){return u.mobile===data.mobile;});
    if(!user) throw {message:"No account found with this mobile number."};
    var hash=await sha256Hex(data.password);
    if(hash!==user.passwordHash) throw {message:"Incorrect password."};
    localSetSession(user.id);
  },

  getMe:async function(){
    var s=localLoadStore(); var user=s.users.find(function(u){return u.id===localSession();});
    if(!user) throw {message:"Session expired. Please log in again."};
    return {name:user.name||"", mobile:user.mobile, currentBusinessId:user.currentBusinessId, language:user.language, appLock:user.appLock, hasPin:!!user.pinHash, autoBackup:user.autoBackup, lastBackupAt:user.lastBackupAt};
  },
  updateMe:async function(patch){
    var s=localLoadStore(); var user=s.users.find(function(u){return u.id===localSession();});
    if(!user) throw {message:"Session expired."};
    if(patch.name!==undefined) user.name=patch.name;
    if(patch.language!==undefined) user.language=patch.language;
    if(patch.appLock!==undefined) user.appLock=patch.appLock;
    if(patch.autoBackup!==undefined) user.autoBackup=patch.autoBackup;
    if(patch.pin){ user.pinHash=await sha256Hex(patch.pin); }
    localSaveStore(s);
    return {hasPin:!!user.pinHash};
  },
  backupNow:async function(){
    var s=localLoadStore(); var user=s.users.find(function(u){return u.id===localSession();});
    user.lastBackupAt=new Date().toISOString();
    localSaveStore(s);
    return {lastBackupAt:user.lastBackupAt};
  },

  listBusinesses:async function(){
    var s=localLoadStore(); var uid=localSession();
    var memberBizIds=s.memberships.filter(function(m){return m.userId===uid;}).map(function(m){return m.businessId;});
    var all=s.businesses.filter(function(b){ return b.ownerId===uid || memberBizIds.indexOf(b.id)>-1; });
    return all.map(function(b){
      return {id:b.id, name:b.name, type:b.type, upiId:b.upiId, customerCount:s.customers.filter(function(c){return c.businessId===b.id;}).length};
    });
  },

  },

    var s=localLoadStore(); var user=s.users.find(function(u){return u.id===localSession();});

  },
  updateBusiness:async function(id, patch){

  getStatement:async function(bizId, custId){

    s.entries.push({id:id, customerId:custId, type:data.type, amount:Number(data.amount), note:data.note||"", date:data.date, createdAt:new Date().toISOString()});

  },

  listInventory:async function(bizId){
    var s=localLoadStore();
    return s.inventory.filter(function(i){return i.businessId===bizId;}).map(function(i){return {id:i.id,name:i.name,price:i.price,qty:i.qty,low:i.low};});

  updateInventoryItem:async function(bizId, id, data){
    var s=localLoadStore(); var it=s.inventory.find(function(x){return x.id===id;});
    if(data.qty!==undefined) it.qty=Number(data.qty);
    if(data.price!==undefined) it.price=Number(data.price);
    localSaveStore(s);
  },

  listBills:async function(bizId){
    var s=localLoadStore();
    return s.bills.filter(function(b){return b.businessId===bizId;}).map(function(b){
      var cust=b.customerId?s.customers.find(function(c){return c.id===b.customerId;}):null;
      var subtotal=b.items.reduce(function(sum,it){return sum+it.qty*it.price;},0);

    });
  },
  createBill:async function(bizId, data){
    var s=localLoadStore(); var id=localNextId(s);
    s.bills.push({id:id, businessId:bizId, customerId:data.customerId||null, gstPercent:Number(data.gstPercent)||0, items:data.items||[], createdAt:new Date().toISOString()});
    localSaveStore(s);
  },

  listStaff:async function(bizId){
    var s=localLoadStore();
    return s.memberships.filter(function(m){return m.businessId===bizId;}).map(function(m){
      return {id:m.id, name:m.name, role: m.role==="owner"?"Owner – full access":(m.canAddEntries?"Staff – can add entries":"Staff – view only"), mobile:m.mobile||"—"};
    });
  },
  createStaff:async function(bizId, data){
    var s=localLoadStore(); var id=localNextId(s);
    s.memberships.push({id:id, businessId:bizId, userId:null, name:data.name, mobile:data.mobile||"", role:"staff", canAddEntries:true, createdAt:new Date().toISOString()});
    localSaveStore(s);
  },

  listDevices:async function(){
    var s=localLoadStore(); var uid=localSession();
    return s.devices.filter(function(d){return d.userId===uid;}).map(function(d){return {id:d.id,name:d.name,lastActive:relativeTime(d.lastActive),current:d.current};});
  },
  createDevice:async function(data){
    var s=localLoadStore(); var uid=localSession(); var id=localNextId(s);
    var d={id:id, userId:uid, name:data.name, lastActive:new Date().toISOString(), current:!!data.current, createdAt:new Date().toISOString()};
    s.devices.push(d); localSaveStore(s);
    return {id:id, name:d.name, lastActive:relativeTime(d.lastActive), current:d.current};
  },

  listNotifications:async function(){
    var s=localLoadStore(); var uid=localSession();
    return s.notifications.filter(function(n){return n.userId===uid;}).map(function(n){return {id:n.id,title:n.title,body:n.body||"",time:relativeTime(n.createdAt),read:!!n.read};});
  },
  deleteNotification:async function(id){
    var s=localLoadStore();
    s.notifications=s.notifications.filter(function(n){return n.id!==id;});
    localSaveStore(s);
  },

  listRecentEntries:async function(bizId, limit){
    var s=localLoadStore();
    var custIds=s.customers.filter(function(c){return c.businessId===bizId;}).map(function(c){return c.id;});
    var rows=s.entries.filter(function(e){return custIds.indexOf(e.customerId)>-1;})
      .slice().sort(function(a,b){ return (b.date+b.createdAt).localeCompare(a.date+a.createdAt); })
      .slice(0, limit||8);
    return rows.map(function(e){
      var c=s.customers.find(function(x){return x.id===e.customerId;});
      return {customerName:c?c.name:"", type:e.type, note:e.note||"", date:e.date, amount:e.amount};
    });
  }
};

    if(data.mobile!==undefined && data.mobile!=="") body.mobile=data.mobile;
    await apiPatch('/businesses/'+bizId+'/customers/'+id+'/', body);
  },
  getStatement:async function(bizId, custId){
    var stmt=await apiGet('/businesses/'+bizId+'/customers/'+custId+'/statement/');
    return {entries:(stmt.entries||[]).map(mapEntry), totals:{given:Number(stmt.totals.given), received:Number(stmt.totals.received), balance:Number(stmt.totals.balance)}};
  },
  createEntry:async function(bizId, custId, data){ await apiPost('/businesses/'+bizId+'/customers/'+custId+'/entries/', data); },

  listInventory:async function(bizId){ return unwrap(await apiGet('/businesses/'+bizId+'/inventory/')).map(mapInventory); },
  createInventoryItem:async function(bizId, data){ await apiPost('/businesses/'+bizId+'/inventory/', {name:data.name, price:data.price, qty:data.qty, low_stock_threshold:data.low||5}); },
  updateInventoryItem:async function(bizId, id, data){ await apiPatch('/businesses/'+bizId+'/inventory/'+id+'/', data); },

  listBills:async function(bizId){
    var custList=await this.listCustomers(bizId);
    return unwrap(await apiGet('/businesses/'+bizId+'/bills/')).map(function(b){ return mapBill(b, custList); });
  },
  createBill:async function(bizId, data){
    var payload={gst_percent:data.gstPercent, items:data.items};
    if(data.customerId) payload.customer=data.customerId;
    await apiPost('/businesses/'+bizId+'/bills/', payload);
  },

  listStaff:async function(bizId){ return unwrap(await apiGet('/businesses/'+bizId+'/staff/')).map(mapStaff); },
  createStaff:async function(bizId, data){ await apiPost('/businesses/'+bizId+'/staff/', {name:data.name, mobile:data.mobile, role:"staff", can_add_entries:true}); },

  listDevices:async function(){ return unwrap(await apiGet('/devices/')).map(mapDevice); },
  createDevice:async function(data){ return mapDevice(await apiPost('/devices/', {name:data.name, is_current:!!data.current})); },

  listNotifications:async function(){ return unwrap(await apiGet('/notifications/')).map(mapNotification); },
  deleteNotification:async function(id){ await apiDelete('/notifications/'+id+'/'); },

  listRecentEntries:async function(bizId, limit){
    return unwrap(await apiGet('/businesses/'+bizId+'/recent-entries/?limit='+(limit||8))).map(function(r){
      return {customerName:r.customer_name, type:r.type, note:r.note||"", date:r.date, amount:Number(r.amount)};
    });
  }
};

function curBiz(){ return DATA.businesses.find(function(b){return b.id===DATA.currentBusinessId;}) || DATA.businesses[0]; }
function custBalance(c){ return Number(c.balance||0); }
function custTotals(c){ return {given:Number(c.given||0), received:Number(c.received||0), balance:Number(c.balance||0)}; }
function bizTotals(biz){
  var given=0,received=0,due=0,advance=0;
  biz.customers.forEach(function(c){ var tt=custTotals(c); given+=tt.given; received+=tt.received; if(tt.balance>0) due+=tt.balance; else advance+=-tt.balance; });
  return {given:given,received:received,due:due,advance:advance};
}
function findCustomer(id){ var biz=curBiz(); return biz.customers.find(function(c){return c.id===id;}); }

/* ---------- data sync (through DB: LocalDB on native, ApiDB in browser) ---------- */
async function refreshBusiness(bizId){
  var biz = DATA.businesses.find(function(b){ return b.id===bizId; });
  if(!biz) return;
  var results = await Promise.all([
    DB.listCustomers(bizId),
    DB.listInventory(bizId),
    DB.listBills(bizId),
    DB.listStaff(bizId),
    DB.listRecentEntries(bizId, 8)
  ]);
  biz.customers = results[0];
  biz.customerCount = results[0].length;
  biz.inventory = results[1];
  biz.bills = results[2];
  biz.staff = results[3];
  biz.recentEntries = results[4].map(function(r){ return {c:{name:r.customerName}, e:{type:r.type, note:r.note, date:r.date, amount:r.amount}}; });
  if(NAV.customerId){
    var openC = biz.customers.find(function(c){ return c.id===NAV.customerId; });
    if(openC){
      try{
        var stmt = await DB.getStatement(bizId, NAV.customerId);
        openC.entries = stmt.entries;
        openC.given=stmt.totals.given; openC.received=stmt.totals.received; openC.balance=stmt.totals.balance;
      }catch(e){}
    }
  }
}

async function ensureCustomerEntries(custId){
  var biz=curBiz();
  var c=findCustomer(custId);
  if(!c) return;
  try{
    var stmt = await DB.getStatement(biz.id, custId);
    c.entries=stmt.entries;
    c.given=stmt.totals.given; c.received=stmt.totals.received; c.balance=stmt.totals.balance;
  }catch(err){ toast(err.message||"Could not load statement","warn"); }
}

async function bootstrapData(){
  var me = await DB.getMe();
  var bizList = await DB.listBusinesses();
  if(!bizList.length) throw {message:"No business found for this account."};
  var currentId = me.currentBusinessId || bizList[0].id;
  if(!bizList.some(function(b){ return b.id===currentId; })) currentId = bizList[0].id;
  var devices = await DB.listDevices();
  if(!devices.length){
    devices=[await DB.createDevice({name:"This device", current:true})];
  }

  DATA = {
    owner:{name: me.name||"", mobile: me.mobile},
    currentBusinessId: currentId,
    businesses: bizList.map(function(b){ return {id:b.id, name:b.name, type:b.type, upiId:b.upiId, customerCount:b.customerCount, customers:[], inventory:[], bills:[], staff:[], recentEntries:[]}; }),
    devices: devices,

/* ---------- fake QR drawing ---------- */
function drawQR(canvas,text){
  var ctx=canvas.getContext("2d");
  var n=23, cell=canvas.width/n;
  ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--surface")||"#fff";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  var dark=(getComputedStyle(document.body).getPropertyValue("--ink")||"#222").trim();
  ctx.fillStyle=dark;
  var h=0; for(var i=0;i<text.length;i++){ h=(h*31+text.charCodeAt(i))>>>0; }
  function rnd(){ h=(h*1103515245+12345)>>>0; return (h>>>8)/16777216; }
  function finder(cx,cy){
    ctx.fillRect(cx*cell,cy*cell,7*cell,7*cell);
    ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--surface")||"#fff";
    ctx.fillRect((cx+1)*cell,(cy+1)*cell,5*cell,5*cell);
    ctx.fillStyle=dark;
    ctx.fillRect((cx+2)*cell,(cy+2)*cell,3*cell,3*cell);
  }
  for(var y=0;y<n;y++){
    for(var x=0;x<n;x++){
      var inFinder=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
      if(inFinder) continue;
      if(rnd()>0.56) ctx.fillRect(x*cell,y*cell,cell,cell);
    }
  }
  finder(0,0); finder(n-7,0); finder(0,n-7);
}

var App = {
  go:function(view){ NAV.view=view; if(view==="reports"){NAV.reportMode=null;NAV.reportCustomerId=null;} render(); window.scrollTo(0,0); },
  importPaymentCSV:function(){
    var input=document.getElementById("paymentFile"), source=document.getElementById("paymentSource").value;
    var file=input&&input.files&&input.files[0];
    if(!file){toast("Please choose a CSV statement first");return;}
    var reader=new FileReader();
    reader.onload=function(){
      var text=String(reader.result||"").replace(/^﻿/,"");
      var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
      if(lines.length<2){toast("CSV file has no transaction rows");return;}
      function cells(line){return line.split(",").map(function(s){return s.trim().replace(/^"|"$/g,"");});}
      var headers=cells(lines[0]).map(function(s){return s.toLowerCase();});
      function col(names){for(var i=0;i<headers.length;i++){if(names.some(function(n){return headers[i].indexOf(n)>=0;}))return i;}return -1;}
      var dateI=col(["date","transaction date","value date"]), nameI=col(["description","details","name","narration","payee","merchant"]), amountI=col(["amount","transaction amount"]), debitI=col(["debit","withdrawal"]), creditI=col(["credit","deposit"]), typeI=col(["type","direction"]), refI=col(["reference","utr","transaction id","txn id","upi ref"]);
      var added=0;
      lines.slice(1).forEach(function(line,index){
        var c=cells(line); if(!c.length)return;
        var rawAmount=amountI>=0?c[amountI]:"";
        var debit=debitI>=0?parseFloat(String(c[debitI]).replace(/[₹,\s]/g,"")):NaN;
        var credit=creditI>=0?parseFloat(String(c[creditI]).replace(/[₹,\s]/g,"")):NaN;
        var amount=Math.abs(parseFloat(String(rawAmount).replace(/[₹,\s]/g,"")));
        var type="Received";
        if(!isNaN(debit)&&debit>0){amount=debit;type="Sent";}
        else if(!isNaN(credit)&&credit>0){amount=credit;type="Received";}
        else if(typeI>=0&&/debit|sent|paid|withdraw/i.test(c[typeI]))type="Sent";
        else if(rawAmount.charAt(0)==="-")type="Sent";
        if(!amount||!isFinite(amount))return;
        PAYMENT_TXNS.push({id:uid("pt"),date:dateI>=0?(c[dateI]||new Date().toISOString().slice(0,10)):new Date().toISOString().slice(0,10),source:source,type:type,name:nameI>=0?(c[nameI]||"Transaction"):"Transaction",upi:"—",amount:amount,ref:refI>=0?(c[refI]||("CSV-"+(index+1))):("CSV-"+(index+1)),note:"Imported CSV"});
        added++;
      });
      if(added){savePaymentStore();NAV.paymentFilter="All";render();toast(added+" transactions imported");}
      else toast("Could not identify amount columns. Use a CSV with Date and Amount, or Debit/Credit columns.");
    };
    reader.onerror=function(){toast("Could not read this file");};
    reader.readAsText(file);
  },
  exportPaymentPDF:function(){
    function clean(value){
      return String(value==null?"":value).normalize("NFKD").replace(/[^\x20-\x7E]/g," ").replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");
    }
    var transactions=PAYMENT_TXNS.slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"");});
    var received=transactions.filter(function(x){return x.type==="Received";}).reduce(function(s,x){return s+Number(x.amount||0);},0);
    var sent=transactions.filter(function(x){return x.type==="Sent";}).reduce(function(s,x){return s+Number(x.amount||0);},0);
    var lines=[
      "DUKAAN KHATA - PAYMENT STATEMENT",
      "Generated: "+new Date().toLocaleString(),
      "Transactions: "+transactions.length,
      "Total received: INR "+received.toFixed(2),
      "Total sent: INR "+sent.toFixed(2),
      "Net movement: INR "+(received-sent).toFixed(2),
      "",
      "DATE       SOURCE          TYPE       NAME / DESCRIPTION",
      "---------------------------------------------------------------"
    ];
    transactions.forEach(function(x){
      var left=(x.date||"").slice(0,10).padEnd(10).slice(0,10)+" "+(x.source||"").padEnd(15).slice(0,15)+" "+(x.type||"").padEnd(10).slice(0,10)+" "+clean(x.name||"Transaction").slice(0,35);
      lines.push(left);
      lines.push("           Amount: INR "+Number(x.amount||0).toFixed(2)+" | Ref: "+clean(x.ref||"-").slice(0,35));
      if(x.note) lines.push("           Note: "+clean(x.note).slice(0,65));
      lines.push("");
    });
    if(!transactions.length) lines.push("No transactions available.");
    lines.push("", "Note: This statement is generated from records saved in Dukaan Khata.");
    lines.push("Verify bank and UPI transactions with the original provider statement.");
    var pages=[];
    while(lines.length) pages.push(lines.splice(0,44));
    var objects=[];
    function obj(body){objects.push(body);return objects.length;}
    var catalogId=obj("");
    var pagesId=obj("");
    var fontId=obj("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
    var pageIds=[];
    pages.forEach(function(pageLines){
      var stream="BT\n/F1 9 Tf\n45 800 Td\n13 TL\n";
      pageLines.forEach(function(line,i){
        if(i===0) stream+="/F1 15 Tf\n";
        if(i===1) stream+="/F1 9 Tf\n";
        stream+="("+clean(line)+") Tj\nT*\n";
      });
      stream+="ET";
      var streamId=obj("<< /Length "+stream.length+" >>\nstream\n"+stream+"\nendstream");
      var pageId=obj("<< /Type /Page /Parent "+pagesId+" 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 "+fontId+" 0 R >> >> /Contents "+streamId+" 0 R >>");
      pageIds.push(pageId);
    });
    objects[catalogId-1]="<< /Type /Catalog /Pages "+pagesId+" 0 R >>";
    objects[pagesId-1]="<< /Type /Pages /Kids ["+pageIds.map(function(id){return id+" 0 R";}).join(" ")+ "] /Count "+pageIds.length+" >>";
    var pdf="%PDF-1.4\n%DKPDF\n",offsets=[0];
    objects.forEach(function(body,i){offsets.push(pdf.length);pdf+=(i+1)+" 0 obj\n"+body+"\nendobj\n";});
    var xref=pdf.length;pdf+="xref\n0 "+(objects.length+1)+"\n0000000000 65535 f \n";
    for(var oi=1;oi<offsets.length;oi++) pdf+=String(offsets[oi]).padStart(10,"0")+" 00000 n \n";
    pdf+="trailer\n<< /Size "+(objects.length+1)+" /Root "+catalogId+" 0 R >>\nstartxref\n"+xref+"\n%%EOF";
    var blob=new Blob([pdf],{type:"application/pdf"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="dukaan-khata-statement.pdf";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1500);
    toast("PDF statement download started");
  },

  submitUpdateStock:async function(ev,id){
    ev.preventDefault();
    var qty=parseFloat(document.getElementById("fQty").value)||0;
    var price=parseFloat(document.getElementById("fPrice").value)||0;
    try{
      var biz=curBiz();
      await DB.updateInventoryItem(biz.id, id, {qty:qty, price:price});
      this.closeModal();
      await refreshBusiness(biz.id);
      render(); toast("Stock updated");
    }catch(err){ toast(err.message||"Could not update stock","warn"); }
    return false;
  },

  setUpiId:async function(v){
    var val=v.trim(); if(!val) return;
    try{
      var biz=curBiz();
      await DB.updateBusiness(biz.id, {upi_id:val});
      biz.upiId=val; render();
    }catch(err){ toast(err.message||"Could not update UPI ID","warn"); }
  },
  markUpiReceived:async function(customerId,amount){
    try{
      var biz=curBiz();
      await DB.createEntry(biz.id, customerId, {type:"received", amount:amount, note:"UPI payment", date:new Date().toISOString().slice(0,10)});
      await refreshBusiness(biz.id);
      render();
      toast("₹"+Math.round(amount)+" marked as received");
    }catch(err){ toast(err.message||"Could not record payment","warn"); }
  },

  checkLoanEligibility:function(){
    var biz=curBiz(); var tot=bizTotals(biz);
    var amount=Math.min(100000, Math.max(10000, Math.round((tot.given+tot.received)*1.2/1000)*1000));
    document.getElementById("loanResult").innerHTML='<div class="card" style="margin-top:12px;background:var(--pos-soft);border-color:var(--pos-soft)"><strong style="color:var(--pos)">You may be eligible for up to '+inr(amount)+'</strong><div class="sub" style="margin-top:4px;color:var(--ink)">Based on your recorded ledger activity (demo estimate only — not a loan offer).</div></div>';
  },

  toggleAutoBackup:async function(v){
    try{
      await DB.updateMe({autoBackup:v});
      DATA.settings.autoBackup=v; render();
      toast(v?"Auto backup enabled":"Auto backup disabled");
    }catch(err){ toast(err.message||"Could not update setting","warn"); }
  },
  backupNow:async function(){
    try{
      var res = await DB.backupNow();
      DATA.settings.lastBackup = res.lastBackupAt? relativeTime(res.lastBackupAt):"Just now";
      render(); toast("Backup completed");
    }catch(err){ toast(err.message||"Backup failed","warn"); }
  },

  openAddStaff:function(){
    this.openModal("Add Staff",
      '<form id="f" onsubmit="return App.submitAddStaff(event)">'+
      '<div class="field"><label>Name</label><input type="text" id="fName" required placeholder="e.g. Divya"></div>'+
      '<div class="field"><label>Mobile</label><input type="tel" id="fMobile" placeholder="98765 43210"></div>'+
      '<div class="sheet-actions"><button type="button" class="btn ghost" onclick="App.closeModal()">Cancel</button><button type="submit" class="btn primary">Add</button></div></form>');
  },
  submitAddStaff:async function(ev){
    ev.preventDefault();
    var name=document.getElementById("fName").value.trim();
    if(!name) return false;
    var mobile=document.getElementById("fMobile").value.trim()||("staff-"+Date.now());
    try{
      var biz=curBiz();
      await DB.createStaff(biz.id, {name:name, mobile:mobile});
      this.closeModal();
      await refreshBusiness(biz.id);
      render(); toast("Staff added");
    }catch(err){ toast(err.message||"Could not add staff","warn"); }
    return false;
  },

  setLanguage:async function(l){
    try{
      await DB.updateMe({language:l});
      DATA.settings.language=l; render();
    }catch(err){ toast(err.message||"Could not change language","warn"); }
  },
  setAppLock:async function(v){
    try{
      await DB.updateMe({appLock:v});
      DATA.settings.appLock=v;
      if(v==="pin"&&!DATA.settings.pin){ render(); this.openSetPin(); } else render();
    }catch(err){ toast(err.message||"Could not update app lock","warn"); }
  },
  openSetPin:function(){
    this.openModal("Set PIN",
      '<form id="f" onsubmit="return App.submitSetPin(event)">'+
      '<div class="field"><label>4-digit PIN</label><input type="tel" id="fPin" maxlength="4" inputmode="numeric" required placeholder="••••" style="letter-spacing:.5em;text-align:center"></div>'+
      '<div class="sheet-actions"><button type="button" class="btn ghost" onclick="App.closeModal()">Cancel</button><button type="submit" class="btn primary">Save PIN</button></div></form>');
  },
  submitSetPin:async function(ev){
    ev.preventDefault();
    var pin=document.getElementById("fPin").value.trim();
    if(pin.length!==4) return false;
    try{
      await DB.updateMe({pin:pin});
      DATA.settings.pin=true;
      this.closeModal(); render(); toast("PIN set");
    }catch(err){ toast(err.message||"Could not set PIN","warn"); }
    return false;
  },

  dismissNotification:async function(id){
    try{
      await DB.deleteNotification(id);
      DATA.notifications=DATA.notifications.filter(function(n){return n.id!==id;});
      render();
    }catch(err){ toast(err.message||"Could not dismiss notification","warn"); }
  },
  toggleFaq:function(i){
    var body=document.getElementById("faqBody"+i);
    body.hidden=!body.hidden;
  },

  openEditProfile:function(){
    this.openModal("Edit Profile",
      '<form id="f" onsubmit="return App.submitEditProfile(event)">'+
      '<div class="field"><label>Your name</label><input type="text" id="fName" required value="'+esc(DATA.owner.name)+'"></div>'+
      '<div class="field"><label>Mobile</label><input type="tel" id="fMobile" value="'+esc(DATA.owner.mobile)+'" disabled></div>'+
      '<div class="sheet-actions"><button type="button" class="btn ghost" onclick="App.closeModal()">Cancel</button><button type="submit" class="btn primary">Save</button></div></form>');
  },
  submitEditProfile:async function(ev){
    ev.preventDefault();
    var name=document.getElementById("fName").value.trim();
    if(!name) return false;
    try{
      await DB.updateMe({name:name});
      DATA.owner.name=name;
      this.closeModal(); render(); toast("Profile updated");
    }catch(err){ toast(err.message||"Could not update profile","warn"); }
    return false;
  },
  logout:function(){
    DB.logout();
    NAV.loggedIn=false; NAV.loginStep="mobile"; NAV.loginMobile=""; NAV.customerId=null; NAV.view="home";
    DATA=null;
    renderLogin();
  },

  copyText:function(text){
    try{
      navigator.clipboard.writeText(text).then(function(){ toast("Copied to clipboard"); }).catch(function(){ toast("Couldn't copy — select the text instead","warn"); });
    }catch(e){ toast("Couldn't copy — select the text instead","warn"); }
  },

  /* login / signup */
  goToSignup:function(){ NAV.loginStep="profile"; renderLogin(); },
  goToLogin:function(){ NAV.loginStep="mobile"; renderLogin(); },
  submitLogin:async function(){
    var mobile=document.getElementById("loginMobile").value.trim().replace(/\D/g,"");
    var password=document.getElementById("loginPassword").value;
    if(mobile.length<10){ toast("Enter a valid 10-digit mobile number","warn"); return; }
    if(!password){ toast("Enter your password","warn"); return; }
    try{
      await DB.login({mobile:mobile, password:password});
      await bootstrapData();
      NAV.loggedIn=true; NAV.view="home"; NAV.loginMobile="";
      render();
      toast("Welcome back!");
    }catch(err){ toast(err.message||"Could not log in. Check your mobile number and password.","warn"); }
  },
  submitProfile:async function(){
    var name=document.getElementById("loginName").value.trim();
    var mobile=document.getElementById("loginMobile2").value.trim().replace(/\D/g,"");
    var password=document.getElementById("loginPassword2").value;
    var bizName=document.getElementById("loginBizName").value.trim();
    if(!name){ toast("Enter your name","warn"); return; }
    if(mobile.length<10){ toast("Enter a valid 10-digit mobile number","warn"); return; }
    if(!password||password.length<4){ toast("Password must be at least 4 characters","warn"); return; }
    try{
      await DB.register({name:name, mobile:mobile, password:password, businessName:bizName});
      await bootstrapData();
      NAV.loggedIn=true; NAV.view="home"; NAV.loginMobile="";
      render();
      toast("Welcome, "+name.split(" ")[0]+"!");
    }catch(err){ toast(err.message||"Could not create account.","warn"); }
  }
};
App.render = render;
window.App = App;
window.NAV = NAV;

/* init */
if(DB.isLoggedIn()){
  bootstrapData().then(function(){
    NAV.loggedIn=true; NAV.view="home"; render();
  }).catch(function(err){
    DB.logout(); NAV.loggedIn=false; renderLogin();
  });
} else {
  renderLogin();
}

})();
</script>
